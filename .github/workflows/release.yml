name: Build and release PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pdfs
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TYPST_VERSION: 0.15.1
      TYPST_SHA256: 48f62ed034aa3a7978309579ac6ca00045e2ef0da73114e8af27cfd8e74dc05a
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Typst
        shell: bash
        run: |
          set -euo pipefail
          gh release download "v${TYPST_VERSION}" --repo typst/typst \
            --pattern typst-aarch64-apple-darwin.tar.xz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$TYPST_SHA256" "$RUNNER_TEMP/typst-aarch64-apple-darwin.tar.xz" \
            | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/typst-aarch64-apple-darwin.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-aarch64-apple-darwin" >> "$GITHUB_PATH"

      - name: Prepare macOS fonts
        run: |
          swift .github/scripts/fonts.swift "$RUNNER_TEMP/ci-fonts"
          echo "TYPST_FONT_PATHS=$RUNNER_TEMP/ci-fonts" >> "$GITHUB_ENV"

      - name: Build PDFs
        run: bash .github/scripts/build.sh

      - name: Compare and publish changed PDFs
        run: python3 .github/scripts/release.py
